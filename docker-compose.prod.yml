name: quill-prod

volumes:
  quill_db:

services:
  api:
    image: quill-api:${VERSION:-latest}
    expose:
      - "3001"
    volumes:
      - quill_db:/data/db
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/db/quill.db
      SESSION_SECRET: ${SESSION_SECRET}
      PORT_API: 3001
      CORS_ORIGINS: ${CORS_ORIGINS}
      LOG_LEVEL: info
      RATE_LIMIT_API_RPM: ${RATE_LIMIT_API_RPM:-120}
      RATE_LIMIT_MCP_RPM: ${RATE_LIMIT_MCP_RPM:-60}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  mcp:
    image: quill-mcp:${VERSION:-latest}
    expose:
      - "3002"
    volumes:
      - quill_db:/data/db
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/db/quill.db
      SESSION_SECRET: ${SESSION_SECRET}
      PORT_MCP: 3002
      LOG_LEVEL: info
      RATE_LIMIT_MCP_RPM: ${RATE_LIMIT_MCP_RPM:-60}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  web:
    image: quill-web:${VERSION:-latest}
    expose:
      - "80"
    restart: always

  blog:
    image: quill-blog:${VERSION:-latest}
    expose:
      - "80"
    restart: always

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - mcp
      - web
      - blog
    restart: always
